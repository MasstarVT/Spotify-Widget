<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS — edit these to customize             ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --px-accent: #ff2d55;   /* border, EQ bars, cursor, label         */
    --px-bg:     #0d0d0f;   /* widget background                      */
    --px-text:   #ffffff;   /* track title                            */
    --px-muted:  #555566;   /* artist name                            */
    --px-title-size: 14px;  /* track title font size                  */
    --px-artist-size: 11px; /* artist name font size                  */
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* ─── Widget shell ──────────────────────────────────────────────── */
  .px-widget {
    position: fixed;
    bottom: 44px;
    left: 44px;
    width: 380px;
    background: var(--px-bg);
    /* triple border: black outer → accent → black inner */
    border: 3px solid var(--px-accent);
    box-shadow:
      0 0 0 3px #000,
      inset 0 0 0 3px #000;
    padding: 14px;
    font-family: 'Press Start 2P', monospace;
    image-rendering: pixelated;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
    user-select: none;
    pointer-events: none;
  }

  .px-widget.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* scanline overlay */
  .px-widget::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(0, 0, 0, 0.16) 3px,
      rgba(0, 0, 0, 0.16) 4px
    );
    pointer-events: none;
    z-index: 20;
  }

  /* ─── Header ────────────────────────────────────────────────────── */
  .px-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--px-accent);
  }

  .px-label {
    font-size: 7px;
    letter-spacing: 1px;
    color: var(--px-accent);
    line-height: 1;
  }

  /* pixel EQ bars — step animation for chunky retro feel */
  .px-eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 14px;
  }

  .px-eq-bar {
    width: 4px;
    background: var(--px-accent);
    animation: px-eq var(--bar-dur) steps(4, end) var(--bar-delay) infinite alternate;
  }

  .px-eq-bar:nth-child(1) { --bar-dur: 0.44s; --bar-delay: 0.00s; }
  .px-eq-bar:nth-child(2) { --bar-dur: 0.56s; --bar-delay: 0.12s; }
  .px-eq-bar:nth-child(3) { --bar-dur: 0.38s; --bar-delay: 0.06s; }
  .px-eq-bar:nth-child(4) { --bar-dur: 0.62s; --bar-delay: 0.18s; }
  .px-eq-bar:nth-child(5) { --bar-dur: 0.48s; --bar-delay: 0.09s; }

  @keyframes px-eq {
    from { height: 4px;  }
    to   { height: 14px; }
  }

  /* ─── Content row ───────────────────────────────────────────────── */
  .px-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* ─── Album art ─────────────────────────────────────────────────── */
  .px-art {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    border: 2px solid var(--px-accent);
    box-shadow: 0 0 0 2px #000;
    position: relative;
    background: #000;
    overflow: hidden;
    image-rendering: pixelated;
  }

  .px-art-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.10);
    font-family: monospace;
  }

  .px-art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1;
  }

  .px-art-img.loaded { opacity: 1; }

  /* ─── Track info ─────────────────────────────────────────────────── */
  .px-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* blinking cursor stays fixed; only title wrap scrolls */
  .px-title-row {
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .px-cursor {
    width: 6px;
    height: 10px;
    background: var(--px-accent);
    flex-shrink: 0;
    margin-right: 5px;
    animation: px-blink 1s steps(1) infinite;
  }

  @keyframes px-blink {
    0%,  49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .px-title-wrap {
    flex: 1;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, #000 80%, transparent 100%);
            mask-image: linear-gradient(to right, #000 80%, transparent 100%);
  }

  .px-title {
    font-size: var(--px-title-size);
    color: var(--px-text);
    white-space: nowrap;
    display: inline-block;
    line-height: 1.5;
    transition: opacity 0.3s ease;
  }

  .px-title.is-scrolling {
    animation: px-marquee var(--scroll-dur, 8s) linear infinite;
  }

  @keyframes px-marquee {
    0%,  20% { transform: translateX(0); }
    70%, 85% { transform: translateX(var(--scroll-px, -60px)); }
    100%      { transform: translateX(0); }
  }

  .px-artist {
    font-size: var(--px-artist-size);
    color: var(--px-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
    transition: opacity 0.3s ease;
  }

  /* ─── Track change fade ─────────────────────────────────────────── */
  .is-changing .px-title,
  .is-changing .px-artist { opacity: 0; }

  /* ─── Paused / idle (classes set by the script) ─────────────────────── */
  .px-widget.is-paused .px-eq-bar { animation-play-state: paused; }
  .px-widget.is-idle   .px-eq { visibility: hidden; }
  .px-widget.is-paused { filter: grayscale(1) opacity(0.55); }   /* grayed out while paused: tweak the amount here */
</style>
</head>
<body>

<div class="px-widget" id="pxWidget">

  <div class="px-header">
    <span class="px-label">&#9654; NOW PLAYING</span>
    <div class="px-eq">
      <div class="px-eq-bar"></div>
      <div class="px-eq-bar"></div>
      <div class="px-eq-bar"></div>
      <div class="px-eq-bar"></div>
      <div class="px-eq-bar"></div>
    </div>
  </div>

  <div class="px-content">
    <div class="px-art">
      <div class="px-art-placeholder">&#9835;</div>
      <img class="px-art-img" id="artImg" alt="">
    </div>
    <div class="px-info">
      <div class="px-title-row">
        <span class="px-cursor"></span>
        <div class="px-title-wrap" id="titleWrap">
          <span class="px-title" id="trackTitle">&#8212;</span>
        </div>
      </div>
      <div class="px-artist" id="trackArtist">&nbsp;</div>
    </div>
  </div>

</div>

<script src="now-playing-source.js"></script>
<script>
(function () {
  'use strict';

  var widget   = document.getElementById('pxWidget');
  var titleEl  = document.getElementById('trackTitle');
  var artistEl = document.getElementById('trackArtist');
  var wrapEl   = document.getElementById('titleWrap');
  var artImg   = document.getElementById('artImg');

  var visible        = false;
  var changing       = false;
  var pending        = null;
  var current        = { title: '', artist: '' };
  var currentArtSrc = null;

  /* ── Scrolling marquee ───────────────────────────────────────────── */
  function applyScroll() {
    titleEl.classList.remove('is-scrolling');
    titleEl.style.removeProperty('--scroll-px');
    titleEl.style.removeProperty('--scroll-dur');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var wrapW     = wrapEl.offsetWidth;
        var titleW    = titleEl.scrollWidth;
        var fadeStart = Math.floor(wrapW * 0.80);
        if (titleW > fadeStart) {
          var px  = -(titleW - fadeStart + 16);
          var dur = Math.max(6, Math.abs(px) / 28).toFixed(1) + 's';
          titleEl.style.setProperty('--scroll-px',  px + 'px');
          titleEl.style.setProperty('--scroll-dur', dur);
          titleEl.classList.add('is-scrolling');
        }
      });
    });
  }

  /* ── Apply track to DOM ──────────────────────────────────────────── */
  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || '\u00A0';   // nbsp keeps the row height when there is no artist
    applyScroll();
  }

  /* ── Show track with fade transition ────────────────────────────── */
  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;
    if (changing) { pending = { title: title, artist: artist }; return; }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) { var p = pending; pending = null; show(p.title, p.artist); }
      }, 300);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 80);
      visible = true;
    }
  }

  /* ── Artwork (src from NowPlayingSource: https URL or blob URL) ───── */
  function setArt(src) {
    if (src === currentArtSrc) return;
    currentArtSrc = src;
    if (!src) {                       // this track has no artwork: don't keep the old cover
      artImg.classList.remove('loaded');
      artImg.removeAttribute('src');
      return;
    }
    artImg.onload  = function () { artImg.classList.add('loaded'); };
    artImg.onerror = function () { artImg.classList.remove('loaded'); };
    artImg.src = src;
  }

  /* Web fonts swap in after the first paint: re-measure the marquee when they do */
  if (document.fonts) document.fonts.addEventListener('loadingdone', applyScroll);

  NowPlayingSource.start(function (track) {
    show(track.title, track.artist);
    setArt(track.artSrc);
    widget.classList.toggle('is-paused', !track.playing);      // freezes the "playing" animation
    widget.classList.toggle('is-idle',   !!track.placeholder); // "Nothing playing" state
  });

}());
</script>

</body>
</html>
