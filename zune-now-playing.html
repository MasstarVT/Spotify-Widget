<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zune Now Playing</title>
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS — edit these to customize             ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --accent-rgb:   255, 69, 0;                /* main accent (bar, glow, rule) as R, G, B */
    --accent-2:     #E60073;                   /* gradient end / art fill tone    */
    --label-rgb:    255, 106, 51;              /* "now playing" label text as R, G, B */
    --title-rgb:    255, 255, 255;             /* track title text as R, G, B     */
    --artist-color: rgba(255, 255, 255, 0.85); /* artist name text                */
    --title-size:   38px;                      /* track title font size           */
    --artist-size:  15px;                      /* artist name font size           */

    /* derived from the values above; no need to edit */
    --accent:       rgb(var(--accent-rgb));
    --label-color:  rgb(var(--label-rgb));
    --title-color:  rgb(var(--title-rgb));
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  /* ─── Widget Shell ─────────────────────────────────────────────────── */
  .zune-widget {
    position: fixed;
    bottom: 52px;
    left: 52px;
    display: flex;
    align-items: stretch;
    opacity: 0;
    transform: translateX(-16px) translateY(10px);
    transition:
      opacity  0.7s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
    pointer-events: none;
    user-select: none;
  }

  .zune-widget.visible {
    opacity: 1;
    transform: translateX(0) translateY(0);
  }

  /* ─── Left Accent Bar ──────────────────────────────────────────────── */
  .zune-accent {
    width: 4px;
    border-radius: 3px 0 0 3px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
    flex-shrink: 0;
    box-shadow:
      0 0 8px  rgba(var(--accent-rgb), 0.95),
      0 0 22px rgba(var(--accent-rgb), 0.55),
      0 0 48px rgba(var(--accent-rgb), 0.2);
    animation: accent-breathe 3.5s ease-in-out infinite;
  }

  @keyframes accent-breathe {
    0%, 100% { opacity: 1;    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.95), 0 0 22px rgba(var(--accent-rgb), 0.55), 0 0 48px rgba(var(--accent-rgb), 0.2); }
    50%       { opacity: 0.78; box-shadow: 0 0 5px rgba(var(--accent-rgb), 0.7), 0 0 14px rgba(var(--accent-rgb), 0.38), 0 0 30px rgba(var(--accent-rgb), 0.12); }
  }

  /* ─── Dark Panel ───────────────────────────────────────────────────── */
  .zune-panel {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 72px 16px 20px;
    background: linear-gradient(
      108deg,
      rgba(0, 0, 0, 0.97) 0%,
      rgba(0, 0, 0, 0.94) 55%,
      rgba(0, 0, 0, 0.00) 100%
    );
  }

  /* ─── Album Art ────────────────────────────────────────────────────── */
  .zune-art {
    width: 86px;
    height: 86px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .zune-art-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(
      135deg,
      var(--accent)   0%,
      var(--accent-2) 42%,
      #000000        100%
    );
    position: relative;
    overflow: hidden;
  }

  /* highlight sheen */
  .zune-art-fill::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 80% 60% at 32% 22%,
      rgba(255,255,255,0.13) 0%,
      transparent 70%
    );
  }

  /* bottom shadow */
  .zune-art-fill::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 36%;
    background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);
  }

  .zune-art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .zune-art-img.loaded {
    opacity: 1;
  }

  /* ─── Track Info ───────────────────────────────────────────────────── */
  .zune-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .zune-now-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--label-color);
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 0 10px rgba(var(--label-rgb), 0.9);
  }

  /* scrollable title container */
  .zune-title-wrap {
    width: 420px;
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(to right, #000 78%, transparent 100%);
            mask-image: linear-gradient(to right, #000 78%, transparent 100%);
  }

  .zune-title {
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--title-color);
    line-height: 1.05;
    letter-spacing: -1.5px;
    white-space: nowrap;
    display: inline-block;
    padding-right: 80px;
    text-shadow:
      0 0 28px rgba(var(--title-rgb), 0.12),
      0 0 56px rgba(var(--accent-rgb), 0.06);
    transition: opacity 0.35s ease;
  }

  .zune-title.is-scrolling {
    animation: title-scroll var(--scroll-dur, 10s) cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes title-scroll {
    0%,  20%  { transform: translateX(0); }
    70%, 100% { transform: translateX(var(--scroll-px, -180px)); }
  }

  .zune-artist {
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 420px;
    margin-top: 4px;
    transition: opacity 0.35s ease;
  }

  /* ─── Track-change fade ─────────────────────────────────────────────── */
  .zune-widget.is-changing .zune-title,
  .zune-widget.is-changing .zune-artist {
    opacity: 0;
  }

  /* ─── Zune-style horizontal rule ───────────────────────────────────── */
  .zune-rule {
    height: 1px;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(to right, rgba(var(--accent-rgb), 0.3) 0%, transparent 100%);
    margin: 5px 0 3px 0;
  }

  /* ─── Paused / idle (classes set by the script) ─────────────────────── */
  .zune-widget.is-paused .zune-accent { animation-play-state: paused; }
  .zune-widget.is-paused { filter: grayscale(1) opacity(0.55); }   /* grayed out while paused: tweak the amount here */
</style>
</head>
<body>

<div class="zune-widget" id="zuneWidget">
  <div class="zune-accent"></div>
  <div class="zune-panel">

    <div class="zune-art">
      <div class="zune-art-fill">
      </div>
      <img class="zune-art-img" id="artImg" alt="">
    </div>

    <div class="zune-info">
      <div class="zune-now-label">now playing</div>
      <div class="zune-rule"></div>
      <div class="zune-title-wrap" id="titleWrap">
        <span class="zune-title" id="trackTitle">—</span>
      </div>
      <div class="zune-artist" id="trackArtist">&nbsp;</div>
    </div>

  </div>
</div>

<script src="now-playing-source.js"></script>
<script>
(function () {
  'use strict';

  const widget   = document.getElementById('zuneWidget');
  const titleEl  = document.getElementById('trackTitle');
  const artistEl = document.getElementById('trackArtist');
  const wrapEl   = document.getElementById('titleWrap');
  const artImg   = document.getElementById('artImg');

  var visible      = false;
  var changing     = false;
  var pending      = null;
  var current      = { title: '', artist: '' };

  /* ── Scrolling marquee ───────────────────────────────────────────── */
  function applyScroll() {
    titleEl.classList.remove('is-scrolling');
    titleEl.style.removeProperty('--scroll-px');
    titleEl.style.removeProperty('--scroll-dur');

    requestAnimationFrame(function () {
      var overflow = titleEl.scrollWidth - wrapEl.clientWidth;
      if (overflow > 8) {
        var px  = -(overflow + 24);
        var dur = Math.max(9, Math.abs(px) / 38).toFixed(1) + 's';
        titleEl.style.setProperty('--scroll-px',  px  + 'px');
        titleEl.style.setProperty('--scroll-dur', dur);
        titleEl.classList.add('is-scrolling');
      }
    });
  }

  /* ── Apply track to DOM ──────────────────────────────────────────── */
  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || '\u00A0';   // nbsp keeps the row height when there is no artist
    applyScroll();
  }

  /* ── Show track (with transition) ───────────────────────────────── */
  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;

    if (changing) {
      pending = { title: title, artist: artist };
      return;
    }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) {
          var p = pending;
          pending = null;
          show(p.title, p.artist);
        }
      }, 370);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 100);
      visible = true;
    }
  }

  var currentArtSrc = null;

  /* ── Artwork (src from NowPlayingSource: https URL or blob URL) ───── */
  function setArt(src) {
    if (src === currentArtSrc) return;
    currentArtSrc = src;
    if (!src) {                       // this track has no artwork: don't keep the old cover
      artImg.classList.remove('loaded');
      artImg.removeAttribute('src');
      return;
    }
    artImg.onload  = function () { artImg.classList.add('loaded'); };
    artImg.onerror = function () { artImg.classList.remove('loaded'); };
    artImg.src = src;
  }

  NowPlayingSource.start(function (track) {
    show(track.title, track.artist);
    setArt(track.artSrc);
    widget.classList.toggle('is-paused', !track.playing);      // freezes the "playing" animation
    widget.classList.toggle('is-idle',   !!track.placeholder); // "Nothing playing" state
  });

}());
</script>

</body>
</html>
