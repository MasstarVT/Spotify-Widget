<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zune Now Playing</title>
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS — edit these to customize             ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --accent:       #FF4500;                /* main accent (bar, glow, rule)   */
    --accent-2:     #E60073;                /* gradient end / art fill tone    */
    --label-color:  #FF6A33;                /* "now playing" label text        */
    --title-color:  #FFFFFF;                /* track title text                */
    --artist-color: rgba(255, 255, 255, 0.85); /* artist name text             */
    --title-size:   38px;                      /* track title font size        */
    --artist-size:  15px;                      /* artist name font size        */
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  /* ─── Widget Shell ─────────────────────────────────────────────────── */
  .zune-widget {
    position: fixed;
    bottom: 52px;
    left: 52px;
    display: flex;
    align-items: stretch;
    opacity: 0;
    transform: translateX(-16px) translateY(10px);
    transition:
      opacity  0.7s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    user-select: none;
  }

  .zune-widget.visible {
    opacity: 1;
    transform: translateX(0) translateY(0);
  }

  /* ─── Left Accent Bar ──────────────────────────────────────────────── */
  .zune-accent {
    width: 4px;
    border-radius: 3px 0 0 3px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
    flex-shrink: 0;
    box-shadow:
      0 0 8px  color-mix(in srgb, var(--accent) 95%, transparent),
      0 0 22px color-mix(in srgb, var(--accent) 55%, transparent),
      0 0 48px color-mix(in srgb, var(--accent) 20%, transparent);
    animation: accent-breathe 3.5s ease-in-out infinite;
  }

  @keyframes accent-breathe {
    0%, 100% { opacity: 1;    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 95%, transparent), 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 48px color-mix(in srgb, var(--accent) 20%, transparent); }
    50%       { opacity: 0.78; box-shadow: 0 0 5px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 38%, transparent), 0 0 30px color-mix(in srgb, var(--accent) 12%, transparent); }
  }

  /* ─── Dark Panel ───────────────────────────────────────────────────── */
  .zune-panel {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 72px 16px 20px;
    background: linear-gradient(
      108deg,
      rgba(0, 0, 0, 0.97) 0%,
      rgba(0, 0, 0, 0.94) 55%,
      rgba(0, 0, 0, 0.00) 100%
    );
  }

  /* ─── Album Art ────────────────────────────────────────────────────── */
  .zune-art {
    width: 86px;
    height: 86px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .zune-art-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(
      135deg,
      var(--accent)   0%,
      var(--accent-2) 42%,
      #000000        100%
    );
    position: relative;
    overflow: hidden;
  }

  /* highlight sheen */
  .zune-art-fill::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 80% 60% at 32% 22%,
      rgba(255,255,255,0.13) 0%,
      transparent 70%
    );
  }

  /* bottom shadow */
  .zune-art-fill::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 36%;
    background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);
  }

  .zune-vinyl {
    position: absolute;
    width: 52px;
    height: 52px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 7px solid rgba(255,255,255,0.07);
    animation: spin 10s linear infinite;
    z-index: 2;
  }

  .zune-vinyl::before {
    content: '';
    position: absolute;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .zune-vinyl::after {
    content: '';
    position: absolute;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.04);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  @keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .zune-art-note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: rgba(255,255,255,0.15);
    z-index: 1;
    line-height: 1;
  }

  .zune-art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .zune-art-img.loaded {
    opacity: 1;
  }

  /* ─── Track Info ───────────────────────────────────────────────────── */
  .zune-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .zune-now-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--label-color);
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 0 10px color-mix(in srgb, var(--label-color) 90%, transparent);
  }

  /* scrollable title container */
  .zune-title-wrap {
    width: 420px;
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(to right, #000 78%, transparent 100%);
            mask-image: linear-gradient(to right, #000 78%, transparent 100%);
  }

  .zune-title {
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--title-color);
    line-height: 1.05;
    letter-spacing: -1.5px;
    white-space: nowrap;
    display: inline-block;
    padding-right: 80px;
    text-shadow:
      0 0 28px color-mix(in srgb, var(--title-color) 12%, transparent),
      0 0 56px color-mix(in srgb, var(--accent) 6%, transparent);
    transition: opacity 0.35s ease;
  }

  .zune-title.is-scrolling {
    animation: title-scroll var(--scroll-dur, 10s) cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes title-scroll {
    0%,  20%  { transform: translateX(0); }
    70%, 100% { transform: translateX(var(--scroll-px, -180px)); }
  }

  .zune-artist {
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 420px;
    margin-top: 4px;
    transition: opacity 0.35s ease;
  }

  /* ─── Track-change fade ─────────────────────────────────────────────── */
  .zune-widget.is-changing .zune-title,
  .zune-widget.is-changing .zune-artist {
    opacity: 0;
  }

  /* ─── Zune-style horizontal rule ───────────────────────────────────── */
  .zune-rule {
    height: 1px;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(to right, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 100%);
    margin: 5px 0 3px 0;
  }
</style>
</head>
<body>

<div class="zune-widget" id="zuneWidget">
  <div class="zune-accent"></div>
  <div class="zune-panel">

    <div class="zune-art">
      <div class="zune-art-fill">
      </div>
      <img class="zune-art-img" id="artImg" alt="">
    </div>

    <div class="zune-info">
      <div class="zune-now-label">now playing</div>
      <div class="zune-rule"></div>
      <div class="zune-title-wrap" id="titleWrap">
        <span class="zune-title" id="trackTitle">—</span>
      </div>
      <div class="zune-artist" id="trackArtist">&nbsp;</div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  const widget   = document.getElementById('zuneWidget');
  const titleEl  = document.getElementById('trackTitle');
  const artistEl = document.getElementById('trackArtist');
  const wrapEl   = document.getElementById('titleWrap');
  const artImg   = document.getElementById('artImg');

  var lastRaw      = null;
  var visible      = false;
  var changing     = false;
  var pending      = null;
  var current      = { title: '', artist: '' };
  var demoInterval = null;

  /* ── Parse snip.txt ──────────────────────────────────────────────── */
  function parse(raw) {
    var lines = raw.trim().split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if (!lines.length) return null;
    if (lines.length >= 2) return { title: lines[0], artist: lines[1] };
    var dash = lines[0].indexOf(' - ');
    if (dash !== -1) return { artist: lines[0].slice(0, dash), title: lines[0].slice(dash + 3) };
    return { title: lines[0], artist: '' };
  }

  /* ── Scrolling marquee ───────────────────────────────────────────── */
  function applyScroll() {
    titleEl.classList.remove('is-scrolling');
    titleEl.style.removeProperty('--scroll-px');
    titleEl.style.removeProperty('--scroll-dur');

    requestAnimationFrame(function () {
      var overflow = titleEl.scrollWidth - wrapEl.clientWidth;
      if (overflow > 8) {
        var px  = -(overflow + 24);
        var dur = Math.max(9, Math.abs(px) / 38).toFixed(1) + 's';
        titleEl.style.setProperty('--scroll-px',  px  + 'px');
        titleEl.style.setProperty('--scroll-dur', dur);
        titleEl.classList.add('is-scrolling');
      }
    });
  }

  /* ── Apply track to DOM ──────────────────────────────────────────── */
  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || ' ';
    applyScroll();
  }

  /* ── Show track (with transition) ───────────────────────────────── */
  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;

    if (changing) {
      pending = { title: title, artist: artist };
      return;
    }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) {
          var p = pending;
          pending = null;
          show(p.title, p.artist);
        }
      }, 370);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 100);
      visible = true;
    }
  }

  /* ── Fetch artwork via XHR blob (avoids file:// caching issues) ─── */
  var currentBlobUrl = null;

  function updateArtwork() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Snip/Snip_artwork.jpg', true);
    xhr.responseType = 'blob';
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.response && xhr.response.size > 0) {
        var newUrl = URL.createObjectURL(xhr.response);
        artImg.onload = function () {
          artImg.classList.add('loaded');
          if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = newUrl;
        };
        artImg.onerror = function () {
          URL.revokeObjectURL(newUrl);
        };
        artImg.src = newUrl;
      }
    };
    xhr.send();
  }

  /* ── Fetch Snip/Snip.txt via XHR (works on file:// in OBS CEF) ──── */
  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Snip/Snip.txt', true);
    xhr.overrideMimeType('text/plain; charset=utf-8');
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText.trim()) {
        if (demoInterval) {
          clearInterval(demoInterval);
          demoInterval = null;
        }
        var raw = xhr.responseText;
        if (raw === lastRaw) return;
        lastRaw = raw;
        var track = parse(raw);
        if (track) {
          show(track.title, track.artist);
          updateArtwork();
        }
      }
    };
    xhr.send();
  }

  /* ── Demo fallback if file unreadable after 3 s ──────────────────── */
  var demos = [
    { title: 'digital love',             artist: 'daft punk'        },
    { title: 'the way you make me feel', artist: 'michael jackson'  },
    { title: 'karma police',             artist: 'radiohead'        },
    { title: 'teardrop',                 artist: 'massive attack'   },
    { title: 'running up that hill',     artist: 'kate bush'        },
  ];

  poll();
  updateArtwork();
  setInterval(poll, 2000);

  setTimeout(function () {
    if (!visible) {
      var i = 0;
      show(demos[i].title, demos[i].artist);
      demoInterval = setInterval(function () {
        i = (i + 1) % demos.length;
        show(demos[i].title, demos[i].artist);
      }, 5000);
    }
  }, 3000);
}());
</script>

</body>
</html>
