# Every push to main becomes a GitHub release with Widget.zip attached, and
# the same files are published to GitHub Pages so widgets that are already
# installed can update themselves (see "Updating" in the README).
#
# Widget.zip is `git archive` of the commit: the tracked files, minus anything
# marked export-ignore in .gitattributes (this .github folder), with the new
# tag stamped into now-playing-source.js (export-subst). Releases are numbered
# V1, V2, V3, ... continuing from the highest existing V<n> tag.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'      # workflow-only changes do not change the zip
  workflow_dispatch:      # run by hand: publishes the site again for the current release

permissions:
  contents: write        # tags and releases
  pages: write           # GitHub Pages deployment
  id-token: write        # required by deploy-pages

concurrency:
  group: release         # one release at a time, so two quick pushes get distinct tags
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, for the notes and the tag check

      - name: Pick a tag
        id: tag
        # A commit that is already released (a manual run, or a re-run) keeps
        # its tag: the site is published again, no second release is made.
        run: |
          have=$(git tag --points-at HEAD -l 'V[0-9]*' | sort -V | tail -1)
          if [ -n "$have" ]; then
            echo "tag=$have" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'V[0-9]*' 'v[0-9]*' | sed -E 's/^[vV]//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          # The hand-made "Release V1" was tagged plain "Release": count it as 1.
          if [ -z "$last" ] && git rev-parse -q --verify refs/tags/Release >/dev/null; then last=1; fi
          n=$(( ${last:-0} + 1 ))
          echo "tag=V$n" >> "$GITHUB_OUTPUT"
          echo "released=false" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: steps.tag.outputs.released != 'true'
        # Before the new tag exists, so "since the previous release" is right.
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="-1"; fi
          {
            echo "Download **Widget.zip** below, unzip it, and read the README for setup."
            echo "Widgets that are already installed pick this version up on their next start;"
            echo "run update-widget.bat (Windows) or update-widget.sh to refresh the files in your folder."
            echo
            echo "## Changes"
            echo
            git log --reverse --format='- **%s**%n%w(0,2,2)%b' $range | grep -v '^ *Co-Authored-By:'
          } > notes.md

      - name: Tag the commit
        if: steps.tag.outputs.released != 'true'
        # git archive below stamps WIDGET_VERSION from the nearest tag.
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Build Widget.zip and the site
        # CRLF text files, like a zip built on Windows (.sh/.py stay LF via .gitattributes).
        # The site is the same export plus the zip and version.json, which the widgets
        # and the update helpers read.
        run: |
          git -c core.autocrlf=true archive --format=zip -o Widget.zip HEAD
          mkdir -p build
          git -c core.autocrlf=true archive --format=tar HEAD | tar -x -C build
          # The site also serves the widget under the names of the files from
          # before the looks were merged (zune-now-playing.html, ...), so an
          # installed copy of one of those updates itself into it and, by its
          # file name, keeps showing that look. Site only, not the zip.
          for t in $(grep -o '<template data-theme="[a-z0-9-]*"' build/widget-now-playing.html | sed 's/.*="//;s/"$//'); do
            cp build/widget-now-playing.html "build/$t-now-playing.html"
          done
          cp Widget.zip build/Widget.zip
          echo "{\"version\":\"${{ steps.tag.outputs.tag }}\"}" > build/version.json
          grep -m1 'WIDGET_VERSION =' build/now-playing-source.js

      - name: Create release
        if: steps.tag.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" Widget.zip \
            --title "Release ${{ steps.tag.outputs.tag }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        # Needs Pages switched on once (repo Settings > Pages > Source: GitHub Actions;
        # a public repo on the free plan). The release above is done by then either way.
        continue-on-error: true
