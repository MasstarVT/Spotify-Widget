<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minimal Square Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS & SIZES — edit these to customize      ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --title-color:   #ffffff;         /* track title color              */
    --artist-color:  rgba(255,255,255,0.6); /* artist name color        */
    --title-size:    20px;            /* track title font size          */
    --artist-size:   15px;            /* artist name font size          */
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .widget {
    position: fixed;
    bottom: 44px;
    left: 44px;
    width: 200px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    user-select: none;
    pointer-events: none;
  }

  .widget.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Album art */
  .art {
    width: 130px;
    height: 130px;
    position: relative;
    overflow: hidden;
    border-radius: 3px;
    margin: 0 auto;
  }

  .art-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255, 255, 255, 0.1);
  }

  .art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .art-img.loaded { opacity: 1; }

  /* Text block */
  .info {
    padding: 10px 2px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
  }

  .title-wrap {
    width: 100%;
  }

  .title {
    font-family: 'Outfit', sans-serif;
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--title-color);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85), 0 2px 20px rgba(0, 0, 0, 0.5);
    transition: opacity 0.3s ease;
    line-height: 1.25;
  }

  .artist {
    font-family: 'Outfit', sans-serif;
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    transition: opacity 0.3s ease;
    line-height: 1.3;
  }

  .is-changing .title,
  .is-changing .artist { opacity: 0; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="art">
    <div class="art-placeholder">&#9835;</div>
    <img class="art-img" id="artImg" alt="">
  </div>
  <div class="info">
    <div class="title-wrap" id="titleWrap">
      <span class="title" id="trackTitle">&#8212;</span>
    </div>
    <div class="artist" id="trackArtist">&nbsp;</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var widget   = document.getElementById('widget');
  var titleEl  = document.getElementById('trackTitle');
  var artistEl = document.getElementById('trackArtist');
  var artImg   = document.getElementById('artImg');

  var lastRaw        = null;
  var visible        = false;
  var changing       = false;
  var pending        = null;
  var current        = { title: '', artist: '' };
  var demoInterval   = null;
  var currentBlobUrl = null;

  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || ' ';
  }

  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;
    if (changing) { pending = { title: title, artist: artist }; return; }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) { var p = pending; pending = null; show(p.title, p.artist); }
      }, 300);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 80);
      visible = true;
    }
  }

  function updateArtwork() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Snip/Snip_artwork.jpg', true);
    xhr.responseType = 'blob';
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.response && xhr.response.size > 0) {
        var newUrl = URL.createObjectURL(xhr.response);
        artImg.onload = function () {
          artImg.classList.add('loaded');
          if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = newUrl;
        };
        artImg.onerror = function () { URL.revokeObjectURL(newUrl); };
        artImg.src = newUrl;
      }
    };
    xhr.send();
  }

  function parse(raw) {
    var lines = raw.trim().split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) return null;
    if (lines.length >= 2) return { title: lines[0], artist: lines[1] };
    var dash = lines[0].indexOf(' - ');
    if (dash !== -1) return { artist: lines[0].slice(0, dash), title: lines[0].slice(dash + 3) };
    return { title: lines[0], artist: '' };
  }

  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Snip/Snip.txt', true);
    xhr.overrideMimeType('text/plain; charset=utf-8');
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText.trim()) {
        if (demoInterval) { clearInterval(demoInterval); demoInterval = null; }
        var raw = xhr.responseText;
        if (raw === lastRaw) return;
        lastRaw = raw;
        var track = parse(raw);
        if (track) { show(track.title, track.artist); updateArtwork(); }
      }
    };
    xhr.send();
  }

  var demos = [
    { title: 'Digital Love',           artist: 'Daft Punk'      },
    { title: 'Running Up That Hill',   artist: 'Kate Bush'      },
    { title: 'Teardrop',               artist: 'Massive Attack' },
    { title: 'Karma Police',           artist: 'Radiohead'      },
    { title: 'God Only Knows',         artist: 'The Beach Boys' },
  ];

  poll();
  updateArtwork();
  setInterval(poll, 2000);

  setTimeout(function () {
    if (!visible) {
      var i = 0;
      show(demos[i].title, demos[i].artist);
      demoInterval = setInterval(function () {
        i = (i + 1) % demos.length;
        show(demos[i].title, demos[i].artist);
      }, 5000);
    }
  }, 3000);
}());
</script>

</body>
</html>
