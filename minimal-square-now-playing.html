<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minimal Square Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS & SIZES — edit these to customize      ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --title-color:   #ffffff;         /* track title color              */
    --artist-color:  rgba(255,255,255,0.6); /* artist name color        */
    --title-size:    20px;            /* track title font size          */
    --artist-size:   15px;            /* artist name font size          */
    --bottom:        44px;                     /* distance from the bottom edge     */
    --left:          44px;                     /* distance from the left edge       */
    --paused-filter: grayscale(1) opacity(0.55); /* look while paused (grayed out)    */
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .widget {
    position: fixed;
    bottom: var(--bottom);
    left: var(--left);
    width: 200px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.5s ease;
    user-select: none;
    pointer-events: none;
  }

  .widget.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Album art */
  .art {
    width: 130px;
    height: 130px;
    position: relative;
    overflow: hidden;
    border-radius: 3px;
    margin: 0 auto;
  }

  .art-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255, 255, 255, 0.1);
  }

  .art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .art-img.loaded { opacity: 1; }

  /* Text block */
  .info {
    padding: 10px 2px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
  }

  .title-wrap {
    width: 100%;
  }

  .title {
    font-family: 'Outfit', sans-serif;
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--title-color);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85), 0 2px 20px rgba(0, 0, 0, 0.5);
    transition: opacity 0.3s ease;
    line-height: 1.25;
  }

  .artist {
    font-family: 'Outfit', sans-serif;
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    transition: opacity 0.3s ease;
    line-height: 1.3;
  }

  .is-changing .title,
  .is-changing .artist { opacity: 0; }

  /* ─── Paused / idle ─────────────────────────────────────────────────── */
  /* The script adds .is-paused (paused) and .is-idle ("Nothing playing") to
     the widget; add rules here if you want those states to look different. */
  .widget.is-paused { filter: var(--paused-filter); }   /* grayed out while paused: --paused-filter in :root sets the look */
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="art">
    <div class="art-placeholder">&#9835;</div>
    <img class="art-img" id="artImg" alt="">
  </div>
  <div class="info">
    <div class="title-wrap" id="titleWrap">
      <span class="title" id="trackTitle">&#8212;</span>
    </div>
    <div class="artist" id="trackArtist">&nbsp;</div>
  </div>
</div>

<script src="now-playing-source.js"></script>
<script>
(function () {
  'use strict';

  var widget   = document.getElementById('widget');
  var titleEl  = document.getElementById('trackTitle');
  var artistEl = document.getElementById('trackArtist');
  var artImg   = document.getElementById('artImg');

  var visible        = false;
  var changing       = false;
  var pending        = null;
  var current        = { title: '', artist: '' };
  var currentArtSrc = null;

  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || '\u00A0';   // nbsp keeps the row height when there is no artist
  }

  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;
    if (changing) { pending = { title: title, artist: artist }; return; }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) { var p = pending; pending = null; show(p.title, p.artist); }
      }, 300);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 80);
      visible = true;
    }
  }

  /* ── Artwork (src from NowPlayingSource: https URL or blob URL) ───── */
  function setArt(src) {
    if (src === currentArtSrc) return;
    currentArtSrc = src;
    if (!src) {                       // this track has no artwork: don't keep the old cover
      artImg.classList.remove('loaded');
      artImg.removeAttribute('src');
      return;
    }
    artImg.onload  = function () { artImg.classList.add('loaded'); };
    artImg.onerror = function () { artImg.classList.remove('loaded'); };
    artImg.src = src;
  }

  NowPlayingSource.start(function (track) {
    show(track.title, track.artist);
    setArt(track.artSrc);
    widget.classList.toggle('is-paused', !track.playing);      // freezes the "playing" animation
    widget.classList.toggle('is-idle',   !!track.placeholder); // "Nothing playing" state
  });

}());
</script>

</body>
</html>
