<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS & SIZES — edit these to customize      ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --title-color:   #ffffff;                   /* track title color    */
    --artist-color:  rgba(255,255,255,0.45);    /* artist name color    */
    --title-size:    14px;                      /* track title font size */
    --artist-size:   11px;                      /* artist name font size */
    --bottom:        44px;                     /* distance from the bottom edge     */
    --left:          44px;                     /* distance from the left edge       */
    --paused-filter: grayscale(1) opacity(0.55); /* look while paused (grayed out)    */
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  .widget {
    position: fixed;
    bottom: var(--bottom);
    left: var(--left);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15, 15, 15, 0.88);
    border-radius: 12px;
    padding: 12px;
    width: 280px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
    user-select: none;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .widget.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Album art */
  .art {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    flex-shrink: 0;
    background: #222;
    position: relative;
    overflow: hidden;
  }

  .art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .art-img.loaded { opacity: 1; }

  .art-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.15);
    font-size: 20px;
  }

  /* Info */
  .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  .title-wrap {
    width: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, #000 75%, transparent 100%);
            mask-image: linear-gradient(to right, #000 75%, transparent 100%);
  }

  .title {
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--title-color);
    white-space: nowrap;
    display: inline-block;
    transition: opacity 0.3s ease;
  }

  .title.is-scrolling {
    animation: marquee var(--scroll-dur, 8s) linear infinite;
  }

  @keyframes marquee {
    0%,  20% { transform: translateX(0); }
    70%, 85% { transform: translateX(var(--scroll-px, -60px)); }
    100%      { transform: translateX(0); }
  }

  .artist {
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.3s ease;
  }

  /* Track change */
  .is-changing .title,
  .is-changing .artist { opacity: 0; }

  /* ─── Paused / idle ─────────────────────────────────────────────────── */
  /* The script adds .is-paused (paused) and .is-idle ("Nothing playing") to
     the widget; add rules here if you want those states to look different. */
  .widget.is-paused { filter: var(--paused-filter); }   /* grayed out while paused: --paused-filter in :root sets the look */
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="art">
    <div class="art-placeholder">♫</div>
    <img class="art-img" id="artImg" alt="">
  </div>
  <div class="info">
    <div class="label">Now Playing</div>
    <div class="title-wrap" id="titleWrap">
      <span class="title" id="trackTitle">—</span>
    </div>
    <div class="artist" id="trackArtist">&nbsp;</div>
  </div>
</div>

<script src="now-playing-source.js"></script>
<script>
(function () {
  'use strict';

  var widget   = document.getElementById('widget');
  var titleEl  = document.getElementById('trackTitle');
  var artistEl = document.getElementById('trackArtist');
  var wrapEl   = document.getElementById('titleWrap');
  var artImg   = document.getElementById('artImg');

  var visible      = false;
  var changing     = false;
  var pending      = null;
  var current      = { title: '', artist: '' };
  var currentArtSrc = null;

  function applyScroll() {
    titleEl.classList.remove('is-scrolling');
    titleEl.style.removeProperty('--scroll-px');
    titleEl.style.removeProperty('--scroll-dur');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var wrapW     = wrapEl.offsetWidth;
        var titleW    = titleEl.scrollWidth;
        var fadeStart = Math.floor(wrapW * 0.85);
        if (titleW > fadeStart) {
          var px  = -(titleW - fadeStart + 16);
          var dur = Math.max(6, Math.abs(px) / 32).toFixed(1) + 's';
          titleEl.style.setProperty('--scroll-px',  px + 'px');
          titleEl.style.setProperty('--scroll-dur', dur);
          titleEl.classList.add('is-scrolling');
        }
      });
    });
  }

  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || '\u00A0';   // nbsp keeps the row height when there is no artist
    applyScroll();
  }

  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;
    if (changing) { pending = { title: title, artist: artist }; return; }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) { var p = pending; pending = null; show(p.title, p.artist); }
      }, 320);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 80);
      visible = true;
    }
  }

  /* ── Artwork (src from NowPlayingSource: https URL or blob URL) ───── */
  function setArt(src) {
    if (src === currentArtSrc) return;
    currentArtSrc = src;
    if (!src) {                       // this track has no artwork: don't keep the old cover
      artImg.classList.remove('loaded');
      artImg.removeAttribute('src');
      return;
    }
    artImg.onload  = function () { artImg.classList.add('loaded'); };
    artImg.onerror = function () { artImg.classList.remove('loaded'); };
    artImg.src = src;
  }

  NowPlayingSource.start(function (track) {
    show(track.title, track.artist);
    setArt(track.artSrc);
    widget.classList.toggle('is-paused', !track.playing);      // freezes the "playing" animation
    widget.classList.toggle('is-idle',   !!track.placeholder); // "Nothing playing" state
  });

}());
</script>

</body>
</html>
