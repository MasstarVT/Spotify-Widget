<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS & SIZES — edit these to customize      ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --title-color:   #ffffff;                   /* track title color    */
    --artist-color:  rgba(255,255,255,0.45);    /* artist name color    */
    --title-size:    14px;                      /* track title font size */
    --artist-size:   11px;                      /* artist name font size */
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  .widget {
    position: fixed;
    bottom: 44px;
    left: 44px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15, 15, 15, 0.88);
    border-radius: 12px;
    padding: 12px;
    width: 280px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    user-select: none;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .widget.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Album art */
  .art {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    flex-shrink: 0;
    background: #222;
    position: relative;
    overflow: hidden;
  }

  .art-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .art-img.loaded { opacity: 1; }

  .art-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.15);
    font-size: 20px;
  }

  /* Info */
  .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  .title-wrap {
    width: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, #000 75%, transparent 100%);
            mask-image: linear-gradient(to right, #000 75%, transparent 100%);
  }

  .title {
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--title-color);
    white-space: nowrap;
    display: inline-block;
    transition: opacity 0.3s ease;
  }

  .title.is-scrolling {
    animation: marquee var(--scroll-dur, 8s) linear infinite;
  }

  @keyframes marquee {
    0%,  20% { transform: translateX(0); }
    70%, 85% { transform: translateX(var(--scroll-px, -60px)); }
    100%      { transform: translateX(0); }
  }

  .artist {
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.3s ease;
  }

  /* Track change */
  .is-changing .title,
  .is-changing .artist { opacity: 0; }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="art">
    <div class="art-placeholder">♫</div>
    <img class="art-img" id="artImg" alt="">
  </div>
  <div class="info">
    <div class="label">Now Playing</div>
    <div class="title-wrap" id="titleWrap">
      <span class="title" id="trackTitle">—</span>
    </div>
    <div class="artist" id="trackArtist">&nbsp;</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var widget   = document.getElementById('widget');
  var titleEl  = document.getElementById('trackTitle');
  var artistEl = document.getElementById('trackArtist');
  var wrapEl   = document.getElementById('titleWrap');
  var artImg   = document.getElementById('artImg');

  var lastRaw      = null;
  var visible      = false;
  var changing     = false;
  var pending      = null;
  var current      = { title: '', artist: '' };
  var demoInterval = null;
  var currentBlobUrl = null;

  function applyScroll() {
    titleEl.classList.remove('is-scrolling');
    titleEl.style.removeProperty('--scroll-px');
    titleEl.style.removeProperty('--scroll-dur');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var wrapW     = wrapEl.offsetWidth;
        var titleW    = titleEl.scrollWidth;
        var fadeStart = Math.floor(wrapW * 0.85);
        if (titleW > fadeStart) {
          var px  = -(titleW - fadeStart + 16);
          var dur = Math.max(6, Math.abs(px) / 32).toFixed(1) + 's';
          titleEl.style.setProperty('--scroll-px',  px + 'px');
          titleEl.style.setProperty('--scroll-dur', dur);
          titleEl.classList.add('is-scrolling');
        }
      });
    });
  }

  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || ' ';
    applyScroll();
  }

  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;
    if (changing) { pending = { title: title, artist: artist }; return; }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) { var p = pending; pending = null; show(p.title, p.artist); }
      }, 320);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 80);
      visible = true;
    }
  }

  function updateArtwork() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Snip/Snip_artwork.jpg', true);
    xhr.responseType = 'blob';
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.response && xhr.response.size > 0) {
        var url = URL.createObjectURL(xhr.response);
        artImg.onload = function () {
          artImg.classList.add('loaded');
          if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = url;
        };
        artImg.onerror = function () { URL.revokeObjectURL(url); };
        artImg.src = url;
      }
    };
    xhr.send();
  }

  function parse(raw) {
    var lines = raw.trim().split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) return null;
    if (lines.length >= 2) return { title: lines[0], artist: lines[1] };
    var dash = lines[0].indexOf(' - ');
    if (dash !== -1) return { artist: lines[0].slice(0, dash), title: lines[0].slice(dash + 3) };
    return { title: lines[0], artist: '' };
  }

  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Snip/Snip.txt', true);
    xhr.overrideMimeType('text/plain; charset=utf-8');
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText.trim()) {
        if (demoInterval) { clearInterval(demoInterval); demoInterval = null; }
        var raw = xhr.responseText;
        if (raw === lastRaw) return;
        lastRaw = raw;
        var track = parse(raw);
        if (track) { show(track.title, track.artist); updateArtwork(); }
      }
    };
    xhr.send();
  }

  var demos = [
    { title: 'Digital Love',             artist: 'Daft Punk'       },
    { title: 'The Way You Make Me Feel', artist: 'Michael Jackson' },
    { title: 'Karma Police',             artist: 'Radiohead'       },
    { title: 'Teardrop',                 artist: 'Massive Attack'  },
    { title: 'Running Up That Hill',     artist: 'Kate Bush'       },
  ];

  poll();
  updateArtwork();
  setInterval(poll, 2000);

  setTimeout(function () {
    if (!visible) {
      var i = 0;
      show(demos[i].title, demos[i].artist);
      demoInterval = setInterval(function () {
        i = (i + 1) % demos.length;
        show(demos[i].title, demos[i].artist);
      }, 5000);
    }
  }, 3000);
}());
</script>

</body>
</html>
