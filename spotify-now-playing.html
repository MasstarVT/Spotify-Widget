<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotify Now Playing</title>
<style>
  /* ╔══════════════════════════════════════════════════════════════════╗
     ║              WIDGET COLORS — edit these to customize             ║
     ╚══════════════════════════════════════════════════════════════════╝ */
  :root {
    --green:        #1DB954;           /* accent color — bars, progress         */
    --bg-card:      #181818;           /* card background                       */
    --bg-art:       #282828;           /* art placeholder background            */
    --text-primary: #FFFFFF;           /* track title                           */
    --text-label:   rgba(255,255,255,0.55); /* "now playing" label             */
    --text-artist:  rgba(255,255,255,0.65); /* artist name                     */
    --title-size:   15px;                  /* track title font size            */
    --artist-size:  12px;                  /* artist name font size            */
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  /* ─── Widget shell ──────────────────────────────────────────────────── */
  .sp-widget {
    position: fixed;
    bottom: 48px;
    left: 48px;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    transition:
      opacity   0.65s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    user-select: none;
  }

  .sp-widget.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* ─── Card ──────────────────────────────────────────────────────────── */
  .sp-card {
    background: var(--bg-card);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.07);
    padding: 14px 16px 13px;
    width: 330px;
    box-shadow:
      0 10px 40px rgba(0,0,0,0.65),
      0 2px 8px  rgba(0,0,0,0.45);
  }

  /* ─── Header row: logo + label + EQ bars ────────────────────────────── */
  .sp-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 13px;
  }

.sp-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--text-label);
    flex: 1;
    line-height: 1;
  }

  /* Equalizer bars */
  .sp-eq {
    display: flex;
    align-items: flex-end;
    gap: 2.5px;
    height: 13px;
  }

  .sp-eq-bar {
    width: 3px;
    background: var(--green);
    border-radius: 1.5px;
    animation: eq-bounce var(--dur, 0.8s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  .sp-eq-bar:nth-child(1) { --dur: 0.72s; --delay: 0.00s; }
  .sp-eq-bar:nth-child(2) { --dur: 0.95s; --delay: 0.18s; }
  .sp-eq-bar:nth-child(3) { --dur: 0.63s; --delay: 0.09s; }
  .sp-eq-bar:nth-child(4) { --dur: 0.88s; --delay: 0.34s; }

  @keyframes eq-bounce {
    0%, 100% { height: 3px; }
    50%       { height: 13px; }
  }

  /* ─── Content row ───────────────────────────────────────────────────── */
  .sp-content {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* ─── Album art ─────────────────────────────────────────────────────── */
  .sp-art {
    width: 74px;
    height: 74px;
    flex-shrink: 0;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    background: var(--bg-art);
    box-shadow: 0 4px 14px rgba(0,0,0,0.55);
  }

  .sp-art-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255,255,255,0.07);
  }

  .sp-art-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 1;
  }

  .sp-art-img.loaded { opacity: 1; }

  /* ─── Track info ────────────────────────────────────────────────────── */
  .sp-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sp-title-wrap {
    width: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, #000 80%, transparent 100%);
            mask-image: linear-gradient(to right, #000 80%, transparent 100%);
  }

  .sp-title {
    font-size: var(--title-size);
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    display: inline-block;
    letter-spacing: -0.2px;
    padding-right: 40px;
    transition: opacity 0.32s ease;
  }

  .sp-title.is-scrolling {
    animation: sp-marquee var(--scroll-dur, 9s) linear infinite;
  }

  @keyframes sp-marquee {
    0%,  18% { transform: translateX(0); }
    65%, 82% { transform: translateX(var(--scroll-px, -60px)); }
    100%      { transform: translateX(0); }
  }

  .sp-artist {
    font-size: var(--artist-size);
    color: var(--text-artist);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.32s ease;
  }

  /* ─── Track change fade ─────────────────────────────────────────────── */
  .sp-widget.is-changing .sp-title,
  .sp-widget.is-changing .sp-artist { opacity: 0; }
</style>
</head>
<body>

<div class="sp-widget" id="spWidget">
  <div class="sp-card">

    <div class="sp-header">
<span class="sp-label">Now Playing</span>
      <div class="sp-eq">
        <div class="sp-eq-bar"></div>
        <div class="sp-eq-bar"></div>
        <div class="sp-eq-bar"></div>
        <div class="sp-eq-bar"></div>
      </div>
    </div>

    <div class="sp-content">
      <div class="sp-art">
        <div class="sp-art-placeholder">♫</div>
        <img class="sp-art-img" id="artImg" alt="">
      </div>
      <div class="sp-info">
        <div class="sp-title-wrap" id="titleWrap">
          <span class="sp-title" id="trackTitle">—</span>
        </div>
        <div class="sp-artist" id="trackArtist">&nbsp;</div>
      </div>
    </div>

  </div>
</div>

<script src="now-playing-source.js"></script>
<script>
(function () {
  'use strict';

  var widget    = document.getElementById('spWidget');
  var titleEl   = document.getElementById('trackTitle');
  var artistEl  = document.getElementById('trackArtist');
  var wrapEl    = document.getElementById('titleWrap');
  var artImg    = document.getElementById('artImg');
  var lastRaw      = null;
  var visible      = false;
  var changing     = false;
  var pending      = null;
  var current      = { title: '', artist: '' };

  /* ── Parse Snip.txt ──────────────────────────────────────────────── */
  function parse(raw) {
    var lines = raw.trim().split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) return null;
    if (lines.length >= 2) return { title: lines[0], artist: lines[1] };
    var dash = lines[0].indexOf(' - ');
    if (dash !== -1) return { artist: lines[0].slice(0, dash), title: lines[0].slice(dash + 3) };
    return { title: lines[0], artist: '' };
  }

  /* ── Scrolling marquee ───────────────────────────────────────────── */
  function applyScroll() {
    titleEl.classList.remove('is-scrolling');
    titleEl.style.removeProperty('--scroll-px');
    titleEl.style.removeProperty('--scroll-dur');

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var overflow = titleEl.scrollWidth - wrapEl.offsetWidth;
        if (overflow > 4) {
          var px  = -(overflow + 24);
          var dur = Math.max(7, Math.abs(px) / 30).toFixed(1) + 's';
          titleEl.style.setProperty('--scroll-px',  px + 'px');
          titleEl.style.setProperty('--scroll-dur', dur);
          titleEl.classList.add('is-scrolling');
        }
      });
    });
  }

  /* ── Apply track to DOM ──────────────────────────────────────────── */
  function applyTrack(title, artist) {
    current.title  = title;
    current.artist = artist;
    titleEl.textContent  = title;
    artistEl.textContent = artist || ' ';
    applyScroll();
  }

  /* ── Show track with fade transition ────────────────────────────── */
  function show(title, artist) {
    if (title === current.title && artist === current.artist) return;

    if (changing) { pending = { title: title, artist: artist }; return; }

    if (current.title) {
      changing = true;
      pending  = null;
      widget.classList.add('is-changing');
      setTimeout(function () {
        applyTrack(title, artist);
        widget.classList.remove('is-changing');
        changing = false;
        if (pending) { var p = pending; pending = null; show(p.title, p.artist); }
      }, 340);
    } else {
      applyTrack(title, artist);
    }

    if (!visible) {
      setTimeout(function () { widget.classList.add('visible'); }, 80);
      visible = true;
    }
  }

  /* ── Artwork ─────────────────────────────────────────────────────── */
  var currentArtSrc = null;

  /* ── Artwork (src from NowPlayingSource: https URL or blob URL) ───── */
  function setArt(src) {
    if (!src || src === currentArtSrc) return;
    currentArtSrc = src;
    artImg.onload = function () { artImg.classList.add('loaded'); };
    artImg.src = src;
  }

  NowPlayingSource.start(function (track) {
    show(track.title, track.artist);
    setArt(track.artSrc);
  });

}());
</script>

</body>
</html>
